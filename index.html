function card(x){return '<article class="card"><div class="cardtop"><div class="shortcuticon" style="background:'+(colors.includes(x.accent)?x.accent:colors[0])+'">'+esc(x.icon||'↗')+'</div><div class="cardactions"><button class="iconbtn" data-act="fav" data-id="'+esc(x.id)+'" aria-label="Toggle favorite">'+(x.is_favorite?'★':'☆')+'</button><button class="iconbtn" data-act="edit" data-id="'+esc(x.id)+'" aria-label="Edit shortcut">✎</button><button class="iconbtn" data-act="delete" data-id="'+esc(x.id)+'" aria-label="Delete shortcut">···</button></div></div><button class="titlebtn" data-act="open" data-id="'+esc(x.id)+'">'+esc(x.title)+'</button><a class="url" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(domain(x.url))+'</a><p class="desc">'+esc(x.description||'A handy link, saved for later.')+'</p><div class="cardfoot"><span class="pill">'+esc(x.category||'General')+'</span><a class="openlink" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">Open link ↗</a></div></article>'}
function render(){if(!user)return;const cats=categories(),list=currentRows(),favs=rows.filter(x=>x.is_favorite).length,name=(user.email||'friend').split('@')[0].split(/[._+-]/)[0];app.innerHTML='<div class="shell"><aside class="sidebar"><div class="sidebrand">'+brand()+'</div><nav class="navs"><button class="nav '+(filter==='All shortcuts'?'active':'')+'" data-act="filter" data-filter="All shortcuts"><span class="ni">▦</span><span class="nt">All shortcuts</span><span class="count">'+rows.length+'</span></button><button class="nav '+(filter==='Favorites'?'active':'')+'" data-act="filter" data-filter="Favorites"><span class="ni">☆</span><span class="nt">Favorites</span><span class="count">'+favs+'</span></button></nav><div class="categorysection"><div class="navlabel">Your categories</div><nav class="navs">'+cats.map(c=>'<button class="nav '+(filter===c?'active':'')+'" data-act="filter" data-filter="'+esc(c)+'"><span class="dot"></span><span class="nt">'+esc(c)+'</span><span class="count">'+rows.filter(x=>x.category===c).length+'</span></button>').join('')+'<button class="nav" data-act="add"><span class="ni">＋</span><span class="nt">Add a shortcut</span></button></nav></div><div class="sidebottom"><div class="privacy"><b>✦ Your space, your rules</b><span>Your links are private to your account and synced to your cloud.</span></div><div class="user"><div class="avatar">'+esc((user.email||'H')[0].toUpperCase())+'</div><div class="umeta"><b>'+esc(user.email||'Signed in')+'</b><small>Personal workspace</small></div><button class="iconbtn" data-act="settings" aria-label="Settings">⚙</button></div></div></aside><main class="main"><header class="topbar"><div class="crumb">Workspace / <b>'+esc(filter)+'</b></div><div class="topright"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search shortcuts…" value="'+esc(search)+'" aria-label="Search shortcuts"></label><button class="btn primary" data-act="add">＋ Add shortcut</button></div></header><div class="content"><section class="greeting"><div><p class="date">Your personal launchpad · '+new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+'</p><h1>'+(new Date().getHours()<12?'Good morning':new Date().getHours()<18?'Good afternoon':'Good evening')+', <span>'+esc(name||'friend')+'</span> ✨</h1><p class="subtitle">A good day starts with the right links close by.</p></div><div class="actions"><button class="btn secondary" data-act="import">↥ Import</button><button class="btn secondary" data-act="export">↧ Export</button></div></section><section class="stats"><div class="stat"><div class="staticon">↗</div><div><small>Total shortcuts</small><b>'+rows.length+'</b></div></div><div class="stat"><div class="staticon">☆</div><div><small>Favorites</small><b>'+favs+'</b></div></div><div class="stat"><div class="staticon">▦</div><div><small>Categories</small><b>'+cats.length+'</b></div></div></section><section><div class="sectionhead"><div><h2>'+esc(filter)+'</h2><p>'+list.length+' shortcut'+(list.length===1?'':'s')+' ready when you are</p></div><div class="viewtoggle"><button class="'+(view==='grid'?'active':'')+'" data-act="view" data-view="grid" aria-label="Grid view">▦</button><button class="'+(view==='list'?'active':'')+'" data-act="view" data-view="list" aria-label="List view">☷</button></div></div>'+(list.length?'<div class="grid '+(view==='list'?'list':'')+'">'+list.map(card).join('')+'</div>':'<div class="empty"><div class="emptyicon">↗</div><h3>'+(search?'No matches just yet':filter==='Favorites'?'No favorites yet':filter!=='All shortcuts'?'No links in this category':'Let’s save your first link')+'</h3><p>'+(search?'Try a different keyword or clear your search.':filter==='Favorites'?'Tap the star on any shortcut to keep it close at hand.':filter!=='All shortcuts'?'Add a shortcut and choose this category.':'Add the sites you use most and make this space your own.')+'</p><button class="btn primary" data-act="'+(search||filter!=='All shortcuts'?'clear':'add')+'">'+(search||filter!=='All shortcuts'?'Show all shortcuts':'＋ Add a shortcut')+'</button></div>')+'</section></div></main></div>';}
function modal(title,subtitle,body){return '<div class="modalback" id="modalback"><section class="modal" role="dialog" aria-modal="true"><div class="modalhead"><div><h2>'+esc(title)+'</h2><p>'+esc(subtitle)+'</p></div><button class="iconbtn" data-act="close" aria-label="Close">×</button></div>'+body+'</section></div>'}
function closeModal(){$('#modalback')?.remove()}
function editor(item=null){editId=item?item.id:null;accent=item&&colors.includes(item.accent)?item.accent:colors[0];const body='<form id="shortcutform"><div class="msg"></div><div class="field"><label>Name</label><input name="title" maxlength="80" required value="'+esc(item?.title||'')+'" placeholder="My project board"></div><div class="field"><label>Website URL</label><input name="url" required value="'+esc(item?.url||'')+'" placeholder="https://example.com"></div><div class="field"><label>Description · optional</label><textarea name="description" maxlength="280" placeholder="What do you use this for?">'+esc(item?.description||'')+'</textarea></div><div class="twocol"><div class="field"><label>Category</label><input name="category" maxlength="40" list="categorylist" required value="'+esc(item?.category|| (filter!=='All shortcuts'&&filter!=='Favorites'?filter:'General'))+'"><datalist id="categorylist">'+categories().map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist></div><div class="field"><label>Icon</label><select name="icon">'+['↗','🌐','✉️','🗓️','🎨','🎧','📚','💻','📊','🎮','🛍️','🧰','📝','🎬','📷','💡','🧭','☁️','⭐','🔖'].map(i=>'<option '+(i===(item?.icon||'↗')?'selected':'')+'>'+i+'</option>').join('')+'</select></div></div><div class="field"><label>Card color</label><div class="swatches">'+colors.map(c=>'<button type="button" style="background:'+c+'" class="'+(c===accent?'active':'')+'" data-color="'+c+'" aria-label="Select color '+c+'"></button>').join('')+'</div></div><label style="display:flex;align-items:center;gap:8px;color:#646a81;font-weight:600"><input type="checkbox" name="is_favorite" '+(item?.is_favorite?'checked':'')+' style="accent-color:#6e5be8"> Add to favorites</label><div class="modalactions"><button class="btn secondary" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">'+(item?'Save changes':'Add shortcut')+'</button></div></form>';app.insertAdjacentHTML('beforeend',modal(item?'Edit shortcut':'Add a shortcut',item?'Tidy up the details for this link.':'Save a place you want to find again.',body));$('#shortcutform [name="title"]').focus()}
async function refresh(){const {data,error}=await db.from(TABLE).select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false});if(error){rows=[];render();toast('Could not load shortcuts. Check the Supabase schema and Data API access. '+error.message,true);return}rows=data||[];if(filter!=='All shortcuts'&&filter!=='Favorites'&&!categories().includes(filter))filter='All shortcuts';render()}
function normalizeUrl(v){v=v.trim();if(!/^https?:\/\//i.test(v))v='https://'+v;let u;try{u=new URL(v)}catch{throw Error('Enter a valid website URL.')}if(!['http:','https:'].includes(u.protocol))throw Error('Only HTTP and HTTPS links are supported.');return u.href}
async function save(e){e.preventDefault();const form=e.target,d=new FormData(form),title=String(d.get('title')||'').trim(),cat=String(d.get('category')||'General').trim()||'General';if(!title)return showMsg(form,'Give this shortcut a name.');if(['all shortcuts','favorites'].includes(cat.toLowerCase()))return showMsg(form,'Please choose a different category name.');let url;try{url=normalizeUrl(String(d.get('url')||''))}catch(err){return showMsg(form,err.message)}const payload={title:title.slice(0,80),url,description:String(d.get('description')||'').trim().slice(0,280),category:cat.slice(0,40),icon:String(d.get('icon')||'↗'),accent,is_favorite:d.get('is_favorite')==='on',updated_at:new Date().toISOString()};const btn=form.querySelector('button[type="submit"]'),before=btn.textContent;btn.disabled=true;btn.textContent='Saving…';try{let r;if(editId)r=await db.from(TABLE).update(payload).eq('id',editId).eq('user_id',user.id);else{payload.user_id=user.id;r=await db.from(TABLE).insert(payload)}if(r.error)throw r.error;closeModal();toast(editId?'Shortcut updated.':'Shortcut saved.');editId=null;await refresh()}catch(err){showMsg(form,'Could not save shortcut: '+err.message)}finally{btn.disabled=false;btn.textContent=before}}
async function action(a,id){if(a==='add')return editor();if(a==='edit')return editor(rows.find(x=>x.id===id));if(a==='close')return closeModal();if(a==='filter'){filter=id;search='';return render()}if(a==='view'){view=id;return render()}if(a==='clear'){filter='All shortcuts';search='';return render()}if(a==='open'){const x=rows.find(x=>x.id===id);if(x)window.open(x.url,'_blank','noopener,noreferrer');return}if(a==='fav'){const x=rows.find(x=>x.id===id);if(!x)return;const r=await db.from(TABLE).update({is_favorite:!x.is_favorite,updated_at:new Date().toISOString()}).eq('id',id).eq('user_id',user.id);if(r.error)return toast(r.error.message,true);await refresh();return toast(x.is_favorite?'Removed from favorites.':'Added to favorites.')}if(a==='delete'){const x=rows.find(x=>x.id===id);if(!x||!confirm('Delete "'+x.title+'"? This cannot be undone.'))return;const r=await db.from(TABLE).delete().eq('id',id).eq('user_id',user.id);if(r.error)return toast(r.error.message,true);await refresh();return toast('Shortcut deleted.')}if(a==='export')return exportData();if(a==='import')return $('#importfile').click();if(a==='settings'){const ok=confirm('Sign out of Hoplink? Click Cancel to stay signed in.');if(ok){const r=await db.auth.signOut();if(r.error)toast(r.error.message,true)}return}}
function exportData(){if(!rows.length)return toast('There are no shortcuts to export yet.');const payload={app:'Hoplink',version:1,exportedAt:new Date().toISOString(),shortcuts:rows.map(({title,url,description,category,icon,accent,is_favorite})=>({title,url,description,category,icon,accent,is_favorite}))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='hoplink-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u);toast('Backup exported.')}
async function importData(file){try{if(file.size>5*1024*1024)throw Error('Choose a backup smaller than 5 MB.');const parsed=JSON.parse(await file.text()),arr=Array.isArray(parsed)?parsed:parsed.shortcuts;if(!Array.isArray(arr)||arr.length>500)throw Error('Invalid backup (maximum 500 shortcuts).');const insert=arr.map(x=>({user_id:user.id,title:String(x.title||'').trim().slice(0,80),url:normalizeUrl(String(x.url||'')),description:String(x.description||'').slice(0,280),category:String(x.category||'General').trim().slice(0,40)||'General',icon:String(x.icon||'↗').slice(0,8),accent:colors.includes(x.accent)?x.accent:colors[0],is_favorite:!!x.is_favorite}));if(insert.some(x=>!x.title))throw Error('Each shortcut needs a title.');if(!insert.length)return toast('The backup is empty.');const r=await db.from(TABLE).insert(insert);if(r.error)throw r.error;await refresh();toast('Imported '+insert.length+' shortcuts.')}catch(err){toast('Import failed: '+err.message,true)}}
async function start(){let conf;try{conf=JSON.parse(localStorage.getItem(CONFIG_KEY)||'null')}catch{}const url=conf?.url||PROJECT_URL,key=conf?.key||PUBLISHABLE_KEY;db=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});db.auth.onAuthStateChange((event,session)=>{setTimeout(async()=>{user=session?.user||null;if(user){if(event==='PASSWORD_RECOVERY')return passwordModal();await refresh()}else{rows=[];auth('signin')}},0)});const {data,error}=await db.auth.getSession();if(error){auth('signin');toast(error.message,true);return}user=data.session?.user||null;if(user)await refresh();else auth('signin')}
function passwordModal(){const body='<form id="newpw"><div class="msg"></div><div class="field"><label>New password</label><input name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="modalactions"><button class="btn primary" type="submit">Save password</button></div></form>';app.insertAdjacentHTML('beforeend',modal('Choose a new password','Set a new password for your Hoplink account.',body))}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-mode],#forgot,[data-color]');if(!b)return;if(b.dataset.mode)return auth(b.dataset.mode);if(b.id==='forgot')return auth('reset');if(b.dataset.color){accent=b.dataset.color;document.querySelectorAll('.swatches button').forEach(x=>x.classList.toggle('active',x===b));return}if(b.dataset.act)action(b.dataset.act,b.dataset.id||b.dataset.filter||b.dataset.view)});
app.addEventListener('submit',async e=>{const form=e.target;if(form.id==='authform'){e.preventDefault();const d=new FormData(form),mode=form.dataset.mode,email=String(d.get('email')||'').trim(),password=String(d.get('password')||''),btn=form.querySelector('button[type=submit]'),old=btn.textContent;btn.disabled=true;btn.textContent='Please wait…';try{let r;if(mode==='signin')r=await db.auth.signInWithPassword({email,password});else if(mode==='signup')r=await db.auth.signUp({email,password,options:{emailRedirectTo:location.href.split('#')[0]}});else r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});if(r.error)showMsg(form,r.error.message);else if(mode==='signup'&&!r.data.session)showMsg(form,'Account created. Check your inbox for the confirmation email, then sign in.');else if(mode==='reset')showMsg(form,'If an account exists for that email, a reset link is on its way.');else toast(mode==='signup'?'Account created. Welcome!':'Welcome back.')}catch(err){showMsg(form,err.message)}finally{btn.disabled=false;btn.textContent=old}return}if(form.id==='shortcutform'){await save(e);return}if(form.id==='newpw'){e.preventDefault();const d=new FormData(form),pw=String(d.get('password')||'');if(pw.length<8)return showMsg(form,'Use at least 8 characters.');const r=await db.auth.updateUser({password:pw});if(r.error)showMsg(form,r.error.message);else{closeModal();toast('Password updated.')}}});
app.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;render();const next=$('#search');next?.focus();next?.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='importfile'&&e.target.files[0]){importData(e.target.files[0]);e.target.value=''}});
document.addEventListener('keydown',e=>{const typing=e.target.matches('input,textarea,select');if(e.key==='Escape')closeModal();if(user&&!typing&&e.key.toLowerCase()==='n'){e.preventDefault();editor()}if(user&&!typing&&e.key==='/'){e.preventDefault();$('#search')?.focus()}});
start();
})();
</script></body></html>
